name: free-vpc-node

on:
  workflow_dispatch:
    inputs:
      node_id:
        description: 'Node slot identifier'
        required: false
        default: '1'
  repository_dispatch:
    types: [spawn-node]

jobs:
  run-node:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Free VPC Node
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          SSH_HOST_ED25519_KEY: ${{ secrets.SSH_HOST_ED25519_KEY }}
          SSH_HOST_RSA_KEY: ${{ secrets.SSH_HOST_RSA_KEY }}
          SSH_AUTHORIZED_KEYS: ${{ secrets.SSH_AUTHORIZED_KEYS }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          NODE_ID: ${{ github.event.inputs.node_id || github.event.client_payload.node_id || '1' }}
          WORKER_URL: https://vm.unsafie.com
        run: |
          chmod +x scripts/entrypoint.sh scripts/firecracker_manager.sh
          ./scripts/entrypoint.sh
