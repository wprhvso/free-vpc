name: free-vpc-node

on:
  workflow_dispatch:
    inputs:
      node_id:
        description: 'Node slot identifier (1-20)'
        required: false
        default: '1'
  repository_dispatch:
    types: [spawn-node]

jobs:
  run-node:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Free VPC Node
        env:
          NODE_ID: ${{ github.event.inputs.node_id || github.event.client_payload.node_id || '1' }}
          CF_TUNNEL_TOKEN_1: ${{ secrets.CF_TUNNEL_TOKEN_1 }}
          CF_TUNNEL_TOKEN_2: ${{ secrets.CF_TUNNEL_TOKEN_2 }}
          CF_TUNNEL_TOKEN_3: ${{ secrets.CF_TUNNEL_TOKEN_3 }}
          YGG_PASSWORD: ${{ secrets.YGG_PASSWORD }}
          K3S_TOKEN: ${{ secrets.K3S_TOKEN }}
          CLUSTER_SALT: ${{ secrets.CLUSTER_SALT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_NAMESPACE: ${{ secrets.HF_NAMESPACE }}
          HF_BUCKET: ${{ secrets.HF_BUCKET }}
          RCLONE_CRYPT_PASSWORD: ${{ secrets.RCLONE_CRYPT_PASSWORD }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          SSH_HOST_ED25519_KEY: ${{ secrets.SSH_HOST_ED25519_KEY }}
          SSH_HOST_RSA_KEY: ${{ secrets.SSH_HOST_RSA_KEY }}
          SSH_AUTHORIZED_KEYS: ${{ secrets.SSH_AUTHORIZED_KEYS }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          chmod +x scripts/entrypoint.sh scripts/cluster_orchestrator.sh
          ./scripts/entrypoint.sh
