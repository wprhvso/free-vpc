apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./gitops/infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: free-vpc
  decryption:
    provider: sops
    secretRef:
      name: sops-age
