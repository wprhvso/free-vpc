apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: free-vpc
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  url: https://github.com/wprhvso/free-vpc.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-sync
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./gitops/clusters/free-vpc
  prune: true
  sourceRef:
    kind: GitRepository
    name: free-vpc
  decryption:
    provider: sops
    secretRef:
      name: sops-age
