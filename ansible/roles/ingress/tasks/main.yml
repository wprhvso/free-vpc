- name: configure rclone s3 backup gateway
  block:
    - name: ensure rclone config directory exists
      file:
        path: /home/runner/.config/rclone
        state: directory
        mode: "0755"
    - name: write rclone configuration
      copy:
        dest: /home/runner/.config/rclone/rclone.conf
        content: |
          [hf-raw]
          type = s3
          provider = Other
          endpoint = https://s3.hf.co/{{ hf_namespace }}
          access_key_id = {{ hf_token }}
          secret_access_key = {{ hf_token }}
          region = us-east-1
          force_path_style = true
          list_version = 2
          upload_cutoff = 2G
          chunk_size = 2G

          [hf-crypt]
          type = crypt
          remote = hf-raw:{{ hf_bucket }}
          filename_encryption = standard
          directory_name_encryption = true
          password = {{ rclone_crypt_password }}
        mode: "0600"
    - name: launch rclone serve s3 in background
      shell: |
        nohup rclone serve s3 hf-crypt: --addr 127.0.0.1:9000 --auth-key "admin,{{ s3_secret_key }}" --vfs-cache-mode minimal >/tmp/rclone.log 2>&1 &
      args:
        executable: /bin/bash
  when: hf_token is defined and hf_token != ""
